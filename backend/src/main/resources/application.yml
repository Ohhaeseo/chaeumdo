server:
  address: 127.0.0.1
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chaeummdo}
    username: ${DB_USER:chaeummdo}
    password: ${DB_PASSWORD:local-development-only}
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB
app:
  media-root: ${MEDIA_ROOT:./.data/media}
  # The traveler cookie is set by TravelerSession; production turns Secure on regardless of the proxy chain.
  secure-cookies: ${SECURE_COOKIES:false}
