server:
  address: 0.0.0.0
  forward-headers-strategy: framework
  shutdown: graceful
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
app:
  media-root: ${MEDIA_ROOT:/app/data/media}
  secure-cookies: true
