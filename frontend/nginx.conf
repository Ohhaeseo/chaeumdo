# Keep the scheme reported by the HTTPS proxy in front; fall back to this hop's scheme.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

# Only POST requests are rate limited: an empty key skips the limit for reads such as /api/auth/me.
map $request_method $post_client {
  POST    $binary_remote_addr;
  default "";
}
limit_req_zone $post_client zone=auth_post:10m rate=10r/m;
limit_req_zone $post_client zone=photo_post:10m rate=60r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Rate limits key on the client address forwarded by a proxy on this host or the Docker network.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  limit_req_status 429;

  gzip on;
  gzip_vary on;
  # Requests arrive through Caddy (or another proxy) with a Via header; nginx skips gzip for those by default.
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types application/json application/javascript image/svg+xml text/css font/otf;

  include /etc/nginx/security-headers.conf;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $forwarded_proto;
  proxy_read_timeout 60s;
  client_max_body_size 16m;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /api/ {
    proxy_pass http://backend:8080/api/;
  }

  location /api/auth/ {
    limit_req zone=auth_post burst=10 nodelay;
    proxy_pass http://backend:8080/api/auth/;
  }

  location = /api/photos {
    limit_req zone=photo_post burst=30 nodelay;
    proxy_pass http://backend:8080/api/photos;
  }

  location /assets/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /data/map/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    try_files $uri =404;
  }

  # Font file names are not content-hashed, so they get a month instead of a year.
  location /fonts/ {
    types {
      font/otf  otf;
      image/png png;
    }
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Always revalidate the entry page so a new deploy never points at deleted hashed assets.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
