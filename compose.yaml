services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chaeummdo
      POSTGRES_USER: chaeummdo
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaeummdo"]
      interval: 5s
      retries: 10
volumes:
  postgres-data:
