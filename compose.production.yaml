# Docker keeps container logs forever by default; each service keeps at most 5 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: chaeummdo
      POSTGRES_USER: chaeummdo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaeummdo"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    logging: *logging
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/chaeummdo
      DB_USER: chaeummdo
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      MEDIA_ROOT: /app/data/media
      PUBLIC_URL: https://${DOMAIN:?DOMAIN is required}
      # SMTP for password reset mail (docs/DEPLOYMENT.md). Without MAIL_HOST, email recovery answers 503.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM:-}
      TERMS_VERSION: ${TERMS_VERSION:-draft-2026-11}
    volumes:
      - media-data:/app/data/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      # Map tiles and place search providers (docs/DEPLOYMENT.md). Empty values keep OpenStreetMap and Photon.
      args:
        VITE_MAP_TILE_URL: ${MAP_TILE_URL:-}
        VITE_MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-}
        VITE_MAP_ATTRIBUTION_URL: ${MAP_ATTRIBUTION_URL:-}
        VITE_PLACE_SEARCH_URL: ${PLACE_SEARCH_URL:-}
        VITE_PLACE_SEARCH_ATTRIBUTION: ${PLACE_SEARCH_ATTRIBUTION:-}
        VITE_PLACE_SEARCH_ATTRIBUTION_URL: ${PLACE_SEARCH_ATTRIBUTION_URL:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy

  # Database dump and photo archive as one pair, at start and then once a day (scripts/backup.sh).
  # BACKUP_DIR on the host still has to be copied off this server; see docs/DEPLOYMENT.md.
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    entrypoint: ["/bin/sh", "/opt/backup.sh", "--daily"]
    environment:
      PGHOST: db
      PGUSER: chaeummdo
      PGDATABASE: chaeummdo
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      MEDIA_DIR: /media
      BACKUP_ROOT: /backups
    volumes:
      - ./scripts/backup.sh:/opt/backup.sh:ro
      - media-data:/media:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
  caddy-data:
  caddy-config:
